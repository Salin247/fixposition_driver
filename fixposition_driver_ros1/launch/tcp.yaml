fp_output:
    formats: [
              "ODOMETRY", "LLH", "ODOMENU", "ODOMSH", "ODOMSTATUS", "TEXT",
            #    "RAWIMU", "CORRIMU",
            #   "IMUBIAS", "GNSSANT", "GNSSCORR", "EOE", "TEXT", "TF", "TP", # FP_A
            #   "GPGGA", "GPGLL", "GNGSA", "GPGST", "GPHDT", "GPRMC", "GPVTG", "GPZDA", "GXGSV" # NMEA
             ]
    type: tcp
    port: "21000"
    ip: "192.168.7.30" # VRTK2 address. Default = v3 (192.168.7.x subnet). Other boxes override per-box via the FIXPOSITION_IP env var (see tcp.launch); v5 = 10.0.7.2
    rate: 60
    reconnect_delay: 5.0 # wait time in [s] until retry connection
    cov_warning: false

customer_input:
    speed_topic: "/fixposition/speed"
    rtcm_topic: "/fixposition/rtcm"
